<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: #000;
        overflow: hidden;
      }
      .layer {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
        opacity: 0;
        transition-property: opacity;
        transition-timing-function: linear;
        transition-duration: 0ms;
      }
      .layer.active { opacity: 1; }
      /* Scale modes map directly onto object-fit. */
      .layer.native { object-fit: none; }
      .layer.fit { object-fit: contain; }
      .layer.fill { object-fit: cover; }
      .layer.stretch { object-fit: fill; }
    </style>
  </head>
  <body>
    <img id="layerA" class="layer fit active" />
    <img id="layerB" class="layer fit" />
    <script>
      (() => {
        const layers = [document.getElementById('layerA'), document.getElementById('layerB')];
        let activeIndex = 0;
        let scaleMode = 'fit';

        function applyClasses() {
          layers.forEach((layer, i) => {
            layer.className = `layer ${scaleMode}${i === activeIndex ? ' active' : ''}`;
          });
        }

        window.__setScaleMode = (mode) => {
          scaleMode = mode;
          applyClasses();
        };

        window.__showSlide = (url, mode, fadeMs) => {
          scaleMode = mode;
          const incoming = layers[1 - activeIndex];
          const outgoing = layers[activeIndex];

          const crossfade = () => {
            incoming.style.transitionDuration = `${fadeMs}ms`;
            outgoing.style.transitionDuration = `${fadeMs}ms`;
            activeIndex = 1 - activeIndex;
            applyClasses();
          };

          incoming.onload = crossfade;
          // A cached image can resolve before onload is attached; covering both
          // keeps a slide from silently never becoming visible.
          incoming.src = url;
          if (incoming.complete && incoming.naturalWidth > 0) crossfade();
        };
      })();
    </script>
  </body>
</html>
