<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: #000;
        overflow: hidden;
      }
      #slide {
        width: 100%;
        height: 100%;
        display: block;
        object-fit: contain;
      }
      /* Scale modes map directly onto object-fit. */
      #slide.native { object-fit: none; }
      #slide.fit { object-fit: contain; }
      #slide.fill { object-fit: cover; }
      #slide.stretch { object-fit: fill; }
    </style>
  </head>
  <body>
    <img id="slide" class="fit" />
  </body>
</html>
